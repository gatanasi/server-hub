services:
  stirling-pdf:
    container_name: stirling-pdf
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:3.2.2@sha256:c6872dd056b0046a14c5de1e9970283e7f1e1ff685bb08090c6b37a231127d31
    ports:
      - '8080:8080'
    volumes:
      - ./StirlingPDF/trainingData:/usr/share/tessdata # Required for extra OCR languages; downloadable
      # Settings, the credential encryption key, custom files and pipelines: named volumes,
      # which backup-docker-volumes.yml archives (it skips bind mounts).
      - extra-configs:/configs
      - custom-files:/customFiles
      - pipeline:/pipeline
      - ./StirlingPDF/logs:/logs/
    environment:
      - DISABLE_ADDITIONAL_FEATURES=false
      - LANGS=en_US
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/info/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  extra-configs:
  custom-files:
  pipeline:
