x-logging: &logging
  # Most guests already default to journald (daemon.json). Declaring it here
  # applies it everywhere, including guests still on unbounded json-file.
  # journald caps its own disk use (SystemMaxUse).
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  n8n:
    container_name: n8n
    logging: *logging
    restart: always
    # Exception to pinning a version: n8n tags its betas with plain versions,
    # and a beta minor is almost always ahead of stable (on 2026-11-18,
    # `stable` was 2.48.5, `beta` 2.49.1, and 3.3.0 a pre-release). Renovate
    # cannot tell them apart, so a version pin gets beta PRs. Follow the
    # stable tag by digest instead.
    image: n8nio/n8n:stable@sha256:c0ea1246a81a34ce8e2b3cfb1f718b97de64b0a1b3747ad24d6d431826bb71ad
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=https
      - N8N_RUNNERS_ENABLED=true
      - NODE_ENV=production
      - WEBHOOK_URL=https://${WEBHOOK_URL}
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=${TIMEZONE}
      - TZ=${TIMEZONE}
    ports:
      - 8080:5678
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:5678/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  n8n_data:
