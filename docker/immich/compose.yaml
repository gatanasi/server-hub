name: immich

x-logging: &logging
  # Most guests already default to journald (daemon.json). Declaring it here
  # applies it everywhere, including guests still on unbounded json-file.
  # journald caps its own disk use (SystemMaxUse).
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  immich-server:
    container_name: immich_server
    logging: *logging
    image: ghcr.io/immich-app/immich-server:v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
    extends:
      file: hwaccel.transcoding.yml
      service: vaapi # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - "8080:2283"
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: always
    # Non-root (audit M4), as documented in Immich's FAQ. UPLOAD_LOCATION must be owned by
    # 1000:1000; Docker creates a missing bind directory as root, so chown it on a new host.
    user: "1000:1000"
    group_add:
      - "992" # render on immich.vm: /dev/dri/renderD128 (VAAPI transcoding)
      - "44" # video on immich.vm: /dev/dri/card1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    logging: *logging
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.2-rocm@sha256:d6910817cb774b1211b2475eb5844af783386eaed00106dea1f0fee9d6184042
    extends:
      file: hwaccel.ml.yml
      service: rocm # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    # Non-root (audit M4). hwaccel.ml.yml already adds `video`; ROCm also needs render.
    user: "1000:1000"
    group_add:
      - "992" # render on immich.vm: /dev/kfd and /dev/dri/renderD128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      ml-cache-owner:
        condition: service_completed_successfully
    healthcheck:
      disable: false

  # One-shot: hands the model-cache volume to the ML user before it starts. Its models are
  # root-owned from when ML ran as root, and a new volume is root-owned too. Runs on every
  # deploy; no healthcheck, its exit code is the check.
  ml-cache-owner:
    image: alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    logging: *logging
    command: ["chown", "-R", "1000:1000", "/cache"]
    volumes:
      - model-cache:/cache
    network_mode: none
    restart: "no"

  redis:
    container_name: immich_redis
    logging: *logging
    image: docker.io/valkey/valkey:9.2.0@sha256:1c2b25b09f354c66fe994733acdf12fcfd4bdf6f3bd92b88a93a70378d884056
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    logging: *logging
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  model-cache:
