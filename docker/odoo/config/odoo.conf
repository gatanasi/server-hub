; Mounted at /etc/odoo/odoo.conf (ODOO_RC). The ./config bind mount hides the
; image's own odoo.conf, so this file must exist: since odoo/docker 65242a59
; (2026-05) wait-for-psql.py reads the [options] section of ODOO_RC and
; crashes when the section is missing.
;
; Database connection comes from HOST and the PG* variables in compose.yaml
; (.env). Keep db_* keys and passwords out of this tracked file.
[options]
addons_path = /mnt/extra-addons
; Not the image default (/var/lib/odoo). This stack ran without a config file,
; so Odoo used its built-in default ~/.local/share/Odoo, and the filestore lives
; there inside the odoo_data volume. Changing this hides every attachment.
data_dir = /var/lib/odoo/.local/share/Odoo
; Odoo 20 defaults to 127.0.0.1 (the 20.0 image sets this line for the same
; reason). Without it the published port goes dead while the in-container
; healthcheck still passes.
http_interface = 0.0.0.0
