x-logging: &logging
  # Most guests already default to journald (daemon.json). Declaring it here
  # applies it everywhere, including guests still on unbounded json-file.
  # journald caps its own disk use (SystemMaxUse).
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  caddy:
    container_name: caddy
    logging: *logging
    build: .
    restart: unless-stopped
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      CF_API_TOKEN: ${CF_API_TOKEN}
      DOMAIN_NAME: ${DOMAIN_NAME}
      INTERNAL_CORS_ORIGIN_ESCAPED_DOMAIN: ${INTERNAL_CORS_ORIGIN_ESCAPED_DOMAIN}
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./conf:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
