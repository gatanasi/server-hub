    - Stirling-PDF:
        icon: stirling-pdf.png
        href: "https://stirling-pdf.home.{{HOMEPAGE_VAR_DOMAIN}}"
        description: PDF tools
        siteMonitor: "https://stirling-pdf.home.{{HOMEPAGE_VAR_DOMAIN}}/api/v1/info/status"
        proxmoxNode: pve-01
        proxmoxVMID: 120
        proxmoxType: lxc

    - ConvertX:
        icon: convertx.png
        href: "https://convertx.home.{{HOMEPAGE_VAR_DOMAIN}}"
        description: File converter
        siteMonitor: "https://convertx.home.{{HOMEPAGE_VAR_DOMAIN}}/healthcheck"
        proxmoxNode: pve-01
        proxmoxVMID: 114
        proxmoxType: lxc

    - Video Converter:
        icon: mdi-video-switch
        href: "https://video-converter.home.{{HOMEPAGE_VAR_DOMAIN}}"
        description: Drive video transcoding
        siteMonitor: "https://video-converter.home.{{HOMEPAGE_VAR_DOMAIN}}/api/config"
        proxmoxNode: pve-01
        proxmoxVMID: 202
        proxmoxType: lxc

    - Car Price Tracker:
        icon: mdi-car
        href: "https://car-price-tracker.home.{{HOMEPAGE_VAR_DOMAIN}}"
        description: Listing price history
        siteMonitor: "https://car-price-tracker.home.{{HOMEPAGE_VAR_DOMAIN}}/api/health"
        proxmoxNode: pve-01
        proxmoxVMID: 204
        proxmoxType: lxc

    - First Bite:
        icon: mdi-silverware-fork-knife
        href: "https://first-bite.home.{{HOMEPAGE_VAR_DOMAIN}}"
        description: Restaurant openings radar
        siteMonitor: "https://first-bite.home.{{HOMEPAGE_VAR_DOMAIN}}/api/health"
        proxmoxNode: pve-01
        proxmoxVMID: 205
        proxmoxType: lxc

    - Ollama:
        icon: ollama.png
        href: "https://ollama.home.{{HOMEPAGE_VAR_DOMAIN}}"
        description: Local LLM API
        siteMonitor: "https://ollama.home.{{HOMEPAGE_VAR_DOMAIN}}"
        proxmoxNode: pve-01
        proxmoxVMID: 220
        proxmoxType: lxc
        # No native widget; count the entries of the Ollama API's model list.
        # https://gethomepage.dev/widgets/services/customapi/
        widget:
          type: customapi
          url: "https://ollama.home.{{HOMEPAGE_VAR_DOMAIN}}/api/tags"
          refreshInterval: 60000
          mappings:
            - field: models
              label: Models
              format: size

    - llama.cpp:
        icon: mdi-brain
        description: Inference guest (no web route)
        proxmoxNode: pve-01
        proxmoxVMID: 221
        proxmoxType: lxc

- Network:
    - Caddy:
        icon: caddy.png
        description: Reverse proxy & TLS
        # Homepage's own health endpoint fetched through Caddy: proves DNS, TLS and proxying.
        # /api/healthcheck is exempt from the auth gate.
        siteMonitor: "https://homepage.home.{{HOMEPAGE_VAR_DOMAIN}}/api/healthcheck"
        proxmoxNode: pve-01
        proxmoxVMID: 301
        # No caddy widget on purpose: it reads Caddy's admin API, which is unauthenticated
        # and can rewrite the whole proxy config. It stays bound to localhost.

    - WG-Easy:
        icon: wireguard.png
        href: "https://wg-easy.home.{{HOMEPAGE_VAR_DOMAIN}}"
        description: WireGuard VPN
        siteMonitor: "https://wg-easy.home.{{HOMEPAGE_VAR_DOMAIN}}"
        proxmoxNode: pve-01
        proxmoxVMID: 250
        widget:
          type: wgeasy
          url: "https://wg-easy.home.{{HOMEPAGE_VAR_DOMAIN}}"
          version: 2 # wg-easy >= v15
          username: "{{HOMEPAGE_VAR_WGEASY_USERNAME}}"
          password: "{{HOMEPAGE_VAR_WGEASY_PASSWORD}}"

    - Tailscale:
        icon: tailscale.png
        href: https://login.tailscale.com/admin/machines
        description: Subnet router & exit node
        proxmoxNode: pve-01
        proxmoxVMID: 251
        proxmoxType: lxc
        widget:
          type: tailscale
          deviceid: "{{HOMEPAGE_VAR_TAILSCALE_DEVICE_ID}}"
          key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"
          fields: ["address", "last_seen", "expires", "update_available"]

    - Cloudflare Tunnel:
        icon: cloudflare-zero-trust.png
        href: https://one.dash.cloudflare.com/
        description: Public ingress (Access-protected)
        proxmoxNode: pve-01
        proxmoxVMID: 252
        proxmoxType: lxc
        widget:
          type: cloudflared
          accountid: "{{HOMEPAGE_VAR_CLOUDFLARED_ACCOUNT_ID}}"
          tunnelid: "{{HOMEPAGE_VAR_CLOUDFLARED_TUNNEL_ID}}"
          key: "{{HOMEPAGE_VAR_CLOUDFLARED_KEY}}"

    - UniFi:
        icon: unifi.png
        href: https://10.10.0.1
        description: UCG Fiber gateway
        widget:
          type: unifi
          url: https://10.10.10.1
          key: "{{HOMEPAGE_VAR_UNIFI_KEY}}"
          fields: ["uptime", "wan", "lan_users", "wlan_users"]

    - OpenSpeedTest:
        icon: openspeedtest.png
        href: "{{HOMEPAGE_VAR_OPENSPEEDTEST_URL}}"
        description: LAN speed test
        siteMonitor: "{{HOMEPAGE_VAR_OPENSPEEDTEST_URL}}"
        proxmoxNode: pve-01
        proxmoxVMID: 200
        proxmoxType: lxc

- Infrastructure:
    - Proxmox:
        icon: proxmox.png
        href: https://10.10.10.10:8006
        description: pve-01
        siteMonitor: https://10.10.10.10:8006
        widget:
          type: proxmox
          url: https://10.10.10.10:8006
          username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"
          node: pve-01

    - Deployer:
        icon: ansible.png
        description: Ansible + SOPS deploy host
        proxmoxNode: pve-01
        proxmoxVMID: 230

    - GitHub Runner:
        icon: github.png
        href: https://github.com/gatanasi/server-hub/actions
        description: Self-hosted Actions runner
        proxmoxNode: pve-01
        proxmoxVMID: 229

    - VPN ARG:
        icon: mdi-vpn
        description: Egress VPN gateway
        proxmoxNode: pve-01
        proxmoxVMID: 249
