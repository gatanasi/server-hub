---
# Services and their widgets. https://gethomepage.dev/configs/services/
#
# Conventions
# - {{HOMEPAGE_VAR_*}} is replaced from the container environment (.env.enc). Always quote it.
# - Anything Caddy fronts is linked AND queried at https://<app>.home.<domain>. Homepage then
#   needs no inbound firewall rule on the target guest, and the status dot reflects what a
#   user actually gets. Trade-off: if Caddy is down, every one of these shows as down.
# - arr.vm services have no Caddy route; they are reached directly (the arr-stack firewall
#   group already allows these ports from the VM network).
# - siteMonitor uses the health endpoint each app's own compose healthcheck uses, where it
#   has one. https://gethomepage.dev/configs/services/#site-monitor
# - proxmoxNode / proxmoxVMID / proxmoxType add guest status and CPU/memory from the Proxmox
#   API. VMIDs come from proxmox/guest-firewalls.md. https://gethomepage.dev/configs/proxmox/

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: "https://jellyfin.home.{{HOMEPAGE_VAR_DOMAIN}}"
        description: Movies & TV
        siteMonitor: "https://jellyfin.home.{{HOMEPAGE_VAR_DOMAIN}}/health"
        proxmoxNode: pve-01
        proxmoxVMID: 500
        proxmoxType: lxc
        widget:
          type: jellyfin
          url: "https://jellyfin.home.{{HOMEPAGE_VAR_DOMAIN}}"
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          # version 1 (default) is correct below Jellyfin 10.12; set `version: 2` from 10.12.
          enableBlocks: true
          enableNowPlaying: true

    - Seerr:
        icon: seerr.png
        href: "https://seerr.home.{{HOMEPAGE_VAR_DOMAIN}}"
        description: Media requests
        siteMonitor: "https://seerr.home.{{HOMEPAGE_VAR_DOMAIN}}/api/v1/status"
        widget:
          type: seerr
          url: "https://seerr.home.{{HOMEPAGE_VAR_DOMAIN}}"
          key: "{{HOMEPAGE_VAR_SEERR_KEY}}"

    - Immich:
        icon: immich.png
        href: "https://immich.home.{{HOMEPAGE_VAR_DOMAIN}}"
        description: Photos & videos
        siteMonitor: "https://immich.home.{{HOMEPAGE_VAR_DOMAIN}}/api/server/ping"
        proxmoxNode: pve-01
        proxmoxVMID: 160
        proxmoxType: lxc
        widget:
          type: immich
          url: "https://immich.home.{{HOMEPAGE_VAR_DOMAIN}}"
          key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
          version: 2 # Immich >= v1.118

    - MediaManager:
        icon: mdi-movie-open
        href: "https://mediamanager.home.{{HOMEPAGE_VAR_DOMAIN}}"
        description: Library manager
        siteMonitor: "https://mediamanager.home.{{HOMEPAGE_VAR_DOMAIN}}"
        # No Homepage widget exists. Guest is not in proxmox/guest-firewalls.md yet; add
        # proxmoxNode / proxmoxVMID / proxmoxType here once its VMID is recorded.

- Downloads:
    - Radarr:
        icon: radarr.png
        href: http://arr.vm:7878
        description: Movies
        siteMonitor: http://arr.vm:7878
        widget:
          type: radarr
          url: http://arr.vm:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"

    - Sonarr:
        icon: sonarr.png
        href: http://arr.vm:8989
        description: Series
        siteMonitor: http://arr.vm:8989
        widget:
          type: sonarr
          url: http://arr.vm:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"

    - Prowlarr:
        icon: prowlarr.png
        href: http://arr.vm:9696
        description: Indexers
        siteMonitor: http://arr.vm:9696
        widget:
          type: prowlarr
          url: http://arr.vm:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"

    - Bazarr:
        icon: bazarr.png
        href: http://arr.vm:6767
        description: Subtitles
        siteMonitor: http://arr.vm:6767
        widget:
          type: bazarr
          url: http://arr.vm:6767
          key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"

    - qBittorrent:
        icon: qbittorrent.png
        href: http://arr.vm:8080
        description: Download client (behind Gluetun)
        siteMonitor: http://arr.vm:8080
        widget:
          type: qbittorrent
          url: http://arr.vm:8080
          username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
          password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"

    - Gluetun:
        icon: gluetun.png
        description: VPN gateway (arr guest)
        proxmoxNode: pve-01
        proxmoxVMID: 501
        proxmoxType: lxc
        # Opt-in: the widget needs Gluetun's control server (port 8000) published and
        # authenticated, which is a change to docker/arr. See docs/HOMEPAGE.md.
        # widget:
        #   type: gluetun
        #   url: http://arr.vm:8000
        #   key: "{{HOMEPAGE_VAR_GLUETUN_KEY}}"
        #   version: 2 # Gluetun >= 3.40.1

    - FlareSolverr:
        icon: flaresolverr.png
        href: http://arr.vm:8191
        description: Challenge solver for Prowlarr
        siteMonitor: http://arr.vm:8191

    - Recommendarr:
        icon: mdi-star-circle
        href: http://arr.vm:3000
        description: Recommendations
        siteMonitor: http://arr.vm:3000

