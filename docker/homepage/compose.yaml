services:
  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18
    restart: unless-stopped
    # HOMEPAGE_VAR_* (substituted into config/*.yaml) and the auth secrets.
    # https://gethomepage.dev/installation/docker/#using-environment-secrets
    env_file:
      - .env
    environment:
      # Required to serve Homepage on anything other than localhost. Must match the Host
      # header Caddy forwards. https://gethomepage.dev/installation/#homepage_allowed_hosts
      HOMEPAGE_ALLOWED_HOSTS: homepage.home.${HOMEPAGE_VAR_DOMAIN:?HOMEPAGE_VAR_DOMAIN is required}
      # Built-in auth gate (v2.0+); password and cookie secret come from .env.
      # https://gethomepage.dev/installation/#security-authentication
      HOMEPAGE_AUTH_ENABLED: "true"
      HOMEPAGE_EXTERNAL_URL: https://homepage.home.${HOMEPAGE_VAR_DOMAIN}
      # Container logs only: no log file under /app/config (read-only mount, no disk writes).
      # https://gethomepage.dev/configs/settings/#log-path
      LOG_TARGETS: stdout
      # Drop root after start-up. https://gethomepage.dev/installation/docker/#running-as-non-root
      PUID: "1000"
      PGID: "1000"
    ports:
      - "8080:3000"
    volumes:
      # Git is the only writer of the configuration, so the app gets it read-only.
      # Every file Homepage expects is shipped: a missing one would make it try to copy a
      # default into this mount and exit.
      - ./config:/app/config:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
