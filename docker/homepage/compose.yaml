services:
  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.home.${HOMEPAGE_VAR_DOMAIN:?HOMEPAGE_VAR_DOMAIN is required}
      HOMEPAGE_AUTH_ENABLED: "true"
      HOMEPAGE_EXTERNAL_URL: https://homepage.home.${HOMEPAGE_VAR_DOMAIN}
      LOG_TARGETS: stdout
      PUID: "1000"
      PGID: "1000"
    ports:
      - "8080:3000"
    volumes:
      - ./config:/app/config:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
