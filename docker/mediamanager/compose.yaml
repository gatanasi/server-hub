x-logging: &logging
  # Most guests already default to journald (daemon.json). Declaring it here
  # applies it everywhere, including guests still on unbounded json-file.
  # journald caps its own disk use (SystemMaxUse).
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  mediamanager:
    container_name: mediamanager
    logging: *logging
    image: ghcr.io/maxdorninger/mediamanager/mediamanager:1.12.3@sha256:83b80dce26f8cdbbf8afec06784a85e7eedcba05ad4be57d2f70b006304d7a8c
    ports:
      - "8080:8000"
    env_file:
      - .env
    volumes:
      # Mount your actual media directories here - these paths should match your config.toml
      - /mnt/data/test/:/data/
      # Config folder for application configuration
      - ./config/:/app/config/
      # Image folder
      - ./images/:/data/images/
    depends_on:
      db:
        condition: service_healthy
    # The startup script runs as root only to chown /app/config and /data, then drops to
    # the image's mediamanager user (uid 1000) with gosu. These capabilities cover that step.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
  db:
    container_name: mediamanager_postgres
    logging: *logging
    image: postgres:19.0@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
    restart: unless-stopped
    volumes:
      # 18+ keeps data in /var/lib/postgresql/<major>/docker, so the volume is
      # mounted one level up and a later pg_upgrade can sit next to it. A major
      # bump is a dump/restore cutover, never a tag change: the old PG17 bind
      # dir (./postgres) stays on the host, unmounted, as the rollback.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

volumes:
  pgdata:
