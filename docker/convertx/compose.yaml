x-logging: &logging
  # Most guests already default to journald (daemon.json). Declaring it here
  # applies it everywhere, including guests still on unbounded json-file.
  # journald caps its own disk use (SystemMaxUse).
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  convertx:
    container_name: convertx
    logging: *logging
    image: ghcr.io/c4illin/convertx:v0.20.0@sha256:6259e0c1e063120b1ddbc6937372a83be58182b2c9dc82264f58e100907b3e51
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      # Login is off on purpose (single user; decided 2026-11-18, audit M9). The gates are:
      #   - internet: Cloudflare Access on the public hostname (Tunnel -> Caddy);
      #   - network: the guest firewall (group from-caddy-proxy) lets only Caddy reach :8080.
      # Inside the network (LAN, WireGuard, Tailscale) DNS points straight at Caddy, so anyone
      # there gets ConvertX without a login. If either gate changes, set this to false.
      - ALLOW_UNAUTHENTICATED=true
      - AUTO_DELETE_EVERY_N_HOURS=6
      - JWT_SECRET=${JWT_SECRET}
      - FFMPEG_ARGS=-c:v libx265 -preset slow -c:a copy -map_metadata 0
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
